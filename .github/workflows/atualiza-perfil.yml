# Atualiza todo dia o cartão "Em números" e a animação das contribuições.
# Os arquivos gerados vão para o branch `output`, para não encher o histórico do main.
name: Atualiza o perfil

on:
  schedule:
    - cron: '17 9 * * *' # 06:17 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-stats.mjs
      - scripts/profile-theme.mjs
      - .github/workflows/atualiza-perfil.yml

permissions:
  contents: write

concurrency:
  group: atualiza-perfil
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Gera o cartão de números e linguagens
        run: node scripts/build-stats.mjs dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERFIL: ${{ github.repository_owner }}

      - name: Gera a animação das contribuições
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#c8ff3e&color_dots=#161f4a,#1f34a8,#2f4bff,#7d93ff,#c8ff3e
            dist/snake-light.svg?palette=github-light&color_snake=#1a2fd0&color_dots=#ebedf0,#c7d0ff,#8ea0ff,#4f68ff,#1a2fd0

      - name: Publica no branch output
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Atualiza números e animação do perfil"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
