<!doctype html>
<!-- Composição da vitrine da Hemodinâmica. Gerada com Chrome headless em 1200 x 800. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Vitrine Hemodinâmica</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 800px; overflow: hidden; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: radial-gradient(circle at 85% 0%, rgba(80, 110, 255, .45), transparent 45%), linear-gradient(135deg, #0a1033 0%, #131f63 60%, #0a1240 100%);
    position: relative;
  }
  .head { position: absolute; top: 30px; left: 44px; right: 44px; display: flex; justify-content: space-between; align-items: center; }
  .title { color: #fff; font-size: 30px; font-weight: 800; display: flex; align-items: center; gap: 16px; letter-spacing: -.5px; }
  .title::before { content: ''; width: 12px; height: 12px; border-radius: 50%; background: #ff6b8a; box-shadow: 0 0 0 6px rgba(255, 107, 138, .18); }
  .kicker { font-family: 'Cascadia Code', Consolas, monospace; color: #c8ff3e; font-size: 15px; letter-spacing: 4px; font-weight: 700; }
  .browser { position: absolute; left: 44px; top: 92px; width: 1000px; height: 690px; border-radius: 16px; overflow: hidden; background: #fff; box-shadow: 0 30px 80px rgba(0, 0, 0, .45), 0 0 0 1px rgba(255, 255, 255, .12); }
  .bar { height: 40px; background: #1b2550; display: flex; align-items: center; gap: 8px; padding: 0 16px; }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; }
  .bar i:nth-child(2) { background: #febc2e; } .bar i:nth-child(3) { background: #28c840; }
  .url { margin-left: 18px; height: 24px; flex: 0 1 420px; border-radius: 12px; background: rgba(255, 255, 255, .1); color: #c9d2ff; font-size: 12px; display: flex; align-items: center; padding: 0 12px; font-family: 'Cascadia Code', Consolas, monospace; }
  .browser img { display: block; width: 1000px; }
  .phone { position: absolute; left: 922px; top: 268px; width: 244px; height: 512px; border-radius: 38px; background: #0b0f24; padding: 10px; box-shadow: 0 30px 70px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .18); }
  .phone .screen { width: 100%; height: 100%; border-radius: 30px; overflow: hidden; background: #fff; }
  .phone img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="head"><div class="title">Hemodinâmica</div><div class="kicker">CARDIOLOGIA INTERVENCIONISTA</div></div>
  <div class="browser"><div class="bar"><i></i><i></i><i></i><div class="url">hemodinamica / procedimentos</div></div><img src="../assets/v3/hemo-procedimentos.png" alt=""></div>
  <div class="phone"><div class="screen"><img src="../assets/v3/hemo-celular.png" alt=""></div></div>
</body>
</html>
