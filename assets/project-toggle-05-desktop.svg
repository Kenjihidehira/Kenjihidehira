<svg width="900" height="84" viewBox="0 0 900 84" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>text{letter-spacing:0}</style>
  <defs>
    <style>
      rect { rx: 0; ry: 0; }
      text { font-kerning: normal; }
    </style>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080D12"/>
      <stop offset="0.62" stop-color="#091119"/>
      <stop offset="1" stop-color="#060A0E"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0D171F"/>
      <stop offset="1" stop-color="#081016"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2F80ED" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0A1117" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2F80ED"/>
      <stop offset="0.72" stop-color="#2F80ED"/>
      <stop offset="1" stop-color="#2F80ED" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="accent-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) rotate(34) scale(620 360)">
      <stop stop-color="#2F80ED" stop-opacity="0.05"/>
      <stop offset="0.58" stop-color="#2F80ED" stop-opacity="0.015"/>
      <stop offset="1" stop-color="#2F80ED" stop-opacity="0"/>
