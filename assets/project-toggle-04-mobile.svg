<svg width="360" height="98" viewBox="0 0 360 98" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>text{letter-spacing:0}</style>
  <defs>
    <style>
      rect { rx: 0; ry: 0; }
      text { font-kerning: normal; }
    </style>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080D12"/>
      <stop offset="0.62" stop-color="#091119"/>
      <stop offset="1" stop-color="#060A0E"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0D171F"/>
      <stop offset="1" stop-color="#081016"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#C8F33D" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0A1117" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#C8F33D"/>
      <stop offset="0.72" stop-color="#87B9F4"/>
      <stop offset="1" stop-color="#87B9F4" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="accent-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) rotate(34) scale(620 360)">
      <stop stop-color="#C8F33D" stop-opacity="0.05"/>
      <stop offset="0.58" stop-color="#C8F33D" stop-opacity="0.015"/>
      <stop offset="1" stop-color="#C8F33D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="micro-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#173047" stroke-width="0.65"/>
      <path d="M12 0V24M0 12H24" fill="none" stroke="#173047" stroke-width="0.25" stroke-opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="358" height="96" rx="11" fill="url(#background)" stroke="#36536D" stroke-width="2"/>
  <rect x="2" y="2" width="356" height="94" rx="10" fill="url(#micro-grid)" opacity="0.42"/>
  <rect x="1" y="1" width="6" height="96" rx="3" fill="#C8F33D"/>
  <rect x="18" y="1" width="324" height="2.5" rx="1.25" fill="url(#accent-line)"/>
  <text x="18" y="25" fill="#C8F33D" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="7.5" font-weight="900" text-anchor="start">04 / SISTEMA</text>
  <rect x="260" y="12" width="82" height="23" rx="11.5" fill="url(#chip)" stroke="#C8F33D" stroke-opacity="0.5"/>
  <circle cx="272" cy="23.5" r="2.8" fill="#C8F33D" filter="url(#glow)"/>
  <text x="282" y="27" fill="#EDF3F7" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="6.8" font-weight="900" text-anchor="start">ONLINE</text>
  <text x="18" y="57" fill="#EDF3F7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17.5" font-weight="950" text-anchor="start">LEADOPS</text>
  <text x="18" y="79" fill="#9EB2C3" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="7.5" font-weight="850" text-anchor="start">CAMPANHAS / SCORE / ROI</text>
  <path d="M330 62L337 69L330 76" stroke="#C8F33D" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
