<svg width="900" height="300" viewBox="0 0 900 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>text{letter-spacing:0}</style>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070C15"/>
      <stop offset="0.55" stop-color="#09111D"/>
      <stop offset="1" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111B2B"/>
      <stop offset="1" stop-color="#0A111D"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#42D8FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#111B2A" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#42D8FF" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#42D8FF"/>
      <stop offset="0.78" stop-color="#42D8FF"/>
      <stop offset="1" stop-color="#42D8FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="accent-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) rotate(34) scale(620 360)">
      <stop stop-color="#42D8FF" stop-opacity="0.18"/>
      <stop offset="0.58" stop-color="#42D8FF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#42D8FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="micro-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#152238" stroke-width="0.7"/>
      <circle cx="1" cy="1" r="0.8" fill="#687994" fill-opacity="0.32"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="898" height="298" rx="12" fill="url(#background)" stroke="#263651" stroke-width="2"/>
  <rect x="2" y="2" width="896" height="296" rx="11" fill="url(#micro-grid)" opacity="0.62"/>
  <rect x="2" y="2" width="896" height="296" rx="11" fill="url(#accent-glow)"/>
  <rect x="22" y="1" width="856" height="3" rx="1.5" fill="url(#accent-line)" filter="url(#glow)"/>
  <path d="M18 26V16H28M882 26V16H872M18 274V284H28M882 274V284H872" stroke="#42D8FF" stroke-opacity="0.58" stroke-width="1.2"/>
  <circle cx="876" cy="278" r="2.5" fill="#42D8FF" filter="url(#glow)"/>
  <text x="28" y="30" fill="#42D8FF" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="10" font-weight="850" text-anchor="start">DIRE&#199;&#195;O / PROCESSO</text>
  <text x="28" y="61" fill="#F4F7FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="950" text-anchor="start">Problemas operacionais viram sistemas rastre&#225;veis.</text>
  <text x="28" y="82" fill="#A7B4C9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="650" text-anchor="start">Diagn&#243;stico, fluxo, aplica&#231;&#227;o, dados e valida&#231;&#227;o na mesma entrega.</text>
  <rect x="28" y="104" width="264" height="88" rx="9" fill="url(#panel)" stroke="#39E6B0" stroke-opacity="0.55"/>
      <circle cx="56" cy="132" r="13" fill="#39E6B0" fill-opacity="0.12" stroke="#39E6B0"/>
      <text x="56" y="136" fill="#39E6B0" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="8" font-weight="900" text-anchor="middle">01</text>
      <text x="78" y="130" fill="#39E6B0" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="8" font-weight="800" text-anchor="start">DIAGN&#211;STICO</text>
      <text x="46" y="161" fill="#F4F7FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="850" text-anchor="start">Entender rotina, regra e risco.</text>
      <text x="46" y="179" fill="#A7B4C9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="650" text-anchor="start">Problema antes da interface.</text><rect x="318" y="104" width="264" height="88" rx="9" fill="url(#panel)" stroke="#42D8FF" stroke-opacity="0.55"/>
      <circle cx="346" cy="132" r="13" fill="#42D8FF" fill-opacity="0.12" stroke="#42D8FF"/>
      <text x="346" y="136" fill="#42D8FF" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="8" font-weight="900" text-anchor="middle">02</text>
      <text x="368" y="130" fill="#42D8FF" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="8" font-weight="800" text-anchor="start">CONSTRU&#199;&#195;O</text>
      <text x="336" y="161" fill="#F4F7FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="850" text-anchor="start">Conectar interface, l&#243;gica e dados.</text>
      <text x="336" y="179" fill="#A7B4C9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="650" text-anchor="start">Fluxo claro e responsabilidade definida.</text><rect x="608" y="104" width="264" height="88" rx="9" fill="url(#panel)" stroke="#7197FF" stroke-opacity="0.55"/>
      <circle cx="636" cy="132" r="13" fill="#7197FF" fill-opacity="0.12" stroke="#7197FF"/>
      <text x="636" y="136" fill="#7197FF" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="8" font-weight="900" text-anchor="middle">03</text>
      <text x="658" y="130" fill="#7197FF" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="8" font-weight="800" text-anchor="start">EVID&#202;NCIA</text>
      <text x="626" y="161" fill="#F4F7FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="850" text-anchor="start">Testar, documentar e publicar.</text>
      <text x="626" y="179" fill="#A7B4C9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="650" text-anchor="start">Qualidade que pode ser conferida.</text>
  <rect x="28" y="216" width="844" height="56" rx="9" fill="url(#panel)" stroke="#263651"/>
  <rect x="28" y="216" width="5" height="56" rx="2.5" fill="#39E6B0"/>
  <text x="50" y="240" fill="#39E6B0" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="8" font-weight="850" text-anchor="start">PRODUTOS WEB</text>
  <text x="50" y="258" fill="#F4F7FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" text-anchor="start">Pain&#233;is, CRMs e controles</text>
  <text x="330" y="240" fill="#42D8FF" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="8" font-weight="850" text-anchor="start">INTEGRA&#199;&#213;ES</text>
  <text x="330" y="258" fill="#F4F7FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" text-anchor="start">APIs, autentica&#231;&#227;o e dados</text>
  <text x="612" y="240" fill="#7197FF" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="8" font-weight="850" text-anchor="start">ENTREGA</text>
  <text x="612" y="258" fill="#F4F7FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" text-anchor="start">Testes, CI e demonstra&#231;&#245;es</text>
  </svg>
