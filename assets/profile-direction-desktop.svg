<svg width="900" height="300" viewBox="0 0 900 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>text{letter-spacing:0}</style>
  <defs>
    <style>
      rect { rx: 0; ry: 0; }
      text { font-kerning: normal; }
    </style>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080D12"/>
      <stop offset="0.62" stop-color="#091119"/>
      <stop offset="1" stop-color="#060A0E"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0D171F"/>
      <stop offset="1" stop-color="#081016"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5CC8FF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0A1117" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5CC8FF"/>
      <stop offset="0.72" stop-color="#2F80ED"/>
      <stop offset="1" stop-color="#2F80ED" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="accent-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) rotate(34) scale(620 360)">
      <stop stop-color="#5CC8FF" stop-opacity="0.05"/>
      <stop offset="0.58" stop-color="#5CC8FF" stop-opacity="0.015"/>
      <stop offset="1" stop-color="#5CC8FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="micro-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#123654" stroke-width="0.65"/>
      <path d="M12 0V24M0 12H24" fill="none" stroke="#123654" stroke-width="0.25" stroke-opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="898" height="298" fill="url(#background)" stroke="#285A86" stroke-width="2"/>
  <rect x="2" y="2" width="896" height="296" fill="url(#micro-grid)" opacity="0.78"/>
  <rect x="2" y="2" width="896" height="296" fill="url(#accent-glow)"/>
  <rect x="24" y="1" width="852" height="2" fill="url(#accent-line)"/>
  <path d="M18 34V16H36M882 34V16H864M18 266V284H36M882 266V284H864" stroke="#5CC8FF" stroke-opacity="0.72" stroke-width="1.25"/>
  <path d="M12 52H24M12 64H20M888 52H876M888 64H880" stroke="#2F80ED" stroke-opacity="0.48"/>
  <circle cx="877" cy="279" r="2.3" fill="#5CC8FF"/>
  <text x="28" y="30" fill="#5CC8FF" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="10" font-weight="850" text-anchor="start">DIRE&#199;&#195;O / PROCESSO</text>
  <text x="28" y="61" fill="#F5FAFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="950" text-anchor="start">Problemas operacionais viram sistemas rastre&#225;veis.</text>
  <text x="28" y="82" fill="#A9C2D8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="650" text-anchor="start">Diagn&#243;stico, fluxo, aplica&#231;&#227;o, dados e valida&#231;&#227;o na mesma entrega.</text>
  <rect x="28" y="104" width="264" height="88" rx="9" fill="url(#panel)" stroke="#46D39A" stroke-opacity="0.55"/>
      <circle cx="56" cy="132" r="13" fill="#46D39A" fill-opacity="0.12" stroke="#46D39A"/>
      <text x="56" y="136" fill="#46D39A" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="8" font-weight="900" text-anchor="middle">01</text>
      <text x="78" y="130" fill="#46D39A" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="8" font-weight="800" text-anchor="start">DIAGN&#211;STICO</text>
      <text x="46" y="161" fill="#F5FAFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="850" text-anchor="start">Entender rotina, regra e risco.</text>
      <text x="46" y="179" fill="#A9C2D8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="650" text-anchor="start">Problema antes da interface.</text><rect x="318" y="104" width="264" height="88" rx="9" fill="url(#panel)" stroke="#5CC8FF" stroke-opacity="0.55"/>
      <circle cx="346" cy="132" r="13" fill="#5CC8FF" fill-opacity="0.12" stroke="#5CC8FF"/>
      <text x="346" y="136" fill="#5CC8FF" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="8" font-weight="900" text-anchor="middle">02</text>
      <text x="368" y="130" fill="#5CC8FF" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="8" font-weight="800" text-anchor="start">CONSTRU&#199;&#195;O</text>
      <text x="336" y="161" fill="#F5FAFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="850" text-anchor="start">Conectar interface, l&#243;gica e dados.</text>
      <text x="336" y="179" fill="#A9C2D8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="650" text-anchor="start">Fluxo claro e responsabilidade definida.</text><rect x="608" y="104" width="264" height="88" rx="9" fill="url(#panel)" stroke="#2F80ED" stroke-opacity="0.55"/>
      <circle cx="636" cy="132" r="13" fill="#2F80ED" fill-opacity="0.12" stroke="#2F80ED"/>
      <text x="636" y="136" fill="#2F80ED" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="8" font-weight="900" text-anchor="middle">03</text>
      <text x="658" y="130" fill="#2F80ED" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="8" font-weight="800" text-anchor="start">EVID&#202;NCIA</text>
      <text x="626" y="161" fill="#F5FAFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="850" text-anchor="start">Testar, documentar e publicar.</text>
      <text x="626" y="179" fill="#A9C2D8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="650" text-anchor="start">Qualidade que pode ser conferida.</text>
  <rect x="28" y="216" width="844" height="56" rx="9" fill="url(#panel)" stroke="#285A86"/>
  <rect x="28" y="216" width="5" height="56" rx="2.5" fill="#46D39A"/>
  <text x="50" y="240" fill="#46D39A" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="8" font-weight="850" text-anchor="start">PRODUTOS WEB</text>
  <text x="50" y="258" fill="#F5FAFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" text-anchor="start">Pain&#233;is, CRMs e controles</text>
  <text x="330" y="240" fill="#5CC8FF" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="8" font-weight="850" text-anchor="start">INTEGRA&#199;&#213;ES</text>
  <text x="330" y="258" fill="#F5FAFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" text-anchor="start">APIs, autentica&#231;&#227;o e dados</text>
  <text x="612" y="240" fill="#2F80ED" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="8" font-weight="850" text-anchor="start">ENTREGA</text>
  <text x="612" y="258" fill="#F5FAFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" text-anchor="start">Testes, CI e demonstra&#231;&#245;es</text>
  </svg>
