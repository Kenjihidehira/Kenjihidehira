<svg width="360" height="440" viewBox="0 0 360 440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>text{letter-spacing:0}</style>
  <defs>
    <style>
      rect { rx: 0; ry: 0; }
      text { font-kerning: normal; }
    </style>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#020712"/>
      <stop offset="0.48" stop-color="#071729"/>
      <stop offset="1" stop-color="#020711"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0B2036"/>
      <stop offset="0.55" stop-color="#08182A"/>
      <stop offset="1" stop-color="#050F1C"/>
    </linearGradient>
    <linearGradient id="panel-active" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#55D6FF" stop-opacity="0.2"/>
      <stop offset="0.42" stop-color="#238CFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#071525" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#55D6FF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0A1117" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#55D6FF"/>
      <stop offset="0.72" stop-color="#238CFF"/>
      <stop offset="1" stop-color="#238CFF" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="accent-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) rotate(34) scale(620 360)">
      <stop stop-color="#55D6FF" stop-opacity="0.12"/>
      <stop offset="0.58" stop-color="#55D6FF" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#55D6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="secondary-glow" cx="1" cy="0" r="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#55D6FF" stop-opacity="0.1"/>
      <stop offset="0.58" stop-color="#238CFF" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#238CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="micro-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#12446A" stroke-width="0.65"/>
      <path d="M12 0V24M0 12H24" fill="none" stroke="#12446A" stroke-width="0.25" stroke-opacity="0.55"/>
    </pattern>
    <pattern id="scan-lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#55D6FF" stroke-width="0.25" stroke-opacity="0.12"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="358" height="438" fill="url(#background)" stroke="#28689E" stroke-width="2"/>
  <rect x="2" y="2" width="356" height="436" fill="url(#secondary-glow)"/>
  <rect x="2" y="2" width="356" height="436" fill="url(#micro-grid)" opacity="0.7"/>
  <rect x="2" y="2" width="356" height="436" fill="url(#scan-lines)"/>
  <rect x="2" y="2" width="356" height="436" fill="url(#accent-glow)"/>
  <rect x="24" y="1" width="312" height="3" fill="url(#accent-line)"/>
  <rect x="1" y="1" width="5" height="438" fill="#55D6FF" fill-opacity="0.18"/>
  <path d="M18 34V16H36M342 34V16H324M18 406V424H36M342 406V424H324" stroke="#55D6FF" stroke-opacity="0.72" stroke-width="1.25"/>
  <path d="M12 52H24M12 64H20M348 52H336M348 64H340" stroke="#238CFF" stroke-opacity="0.48"/>
  <path d="M302 423H318M322 423H328" stroke="#55D6FF" stroke-opacity="0.8"/>
  <circle cx="337" cy="419" r="2.3" fill="#55D6FF"/>
  <text x="18" y="28" fill="#55D6FF" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="8" font-weight="850" text-anchor="start">DIRE&#199;&#195;O / PROCESSO</text>
  <text x="18" y="57" fill="#F5FAFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="950" text-anchor="start">Problemas operacionais viram</text>
  <text x="18" y="78" fill="#F5FAFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="950" text-anchor="start">sistemas rastre&#225;veis.</text>
  <text x="18" y="99" fill="#B2CCE2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="650" text-anchor="start">Diagn&#243;stico, fluxo, aplica&#231;&#227;o, dados e valida&#231;&#227;o.</text>
  <rect x="18" y="118" width="324" height="68" rx="8" fill="url(#panel)" stroke="#46D39A" stroke-opacity="0.55"/>
      <circle cx="44" cy="142" r="11" fill="#46D39A" fill-opacity="0.12" stroke="#46D39A"/>
      <text x="44" y="145" fill="#46D39A" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="7" font-weight="900" text-anchor="middle">01</text>
      <text x="66" y="140" fill="#46D39A" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="7" font-weight="850" text-anchor="start">DIAGN&#211;STICO</text>
      <text x="66" y="159" fill="#F5FAFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="850" text-anchor="start">Entender rotina, regra e risco.</text>
      <text x="66" y="175" fill="#B2CCE2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8" font-weight="650" text-anchor="start">Problema antes da interface.</text><rect x="18" y="196" width="324" height="68" rx="8" fill="url(#panel)" stroke="#55D6FF" stroke-opacity="0.55"/>
      <circle cx="44" cy="220" r="11" fill="#55D6FF" fill-opacity="0.12" stroke="#55D6FF"/>
      <text x="44" y="223" fill="#55D6FF" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="7" font-weight="900" text-anchor="middle">02</text>
      <text x="66" y="218" fill="#55D6FF" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="7" font-weight="850" text-anchor="start">CONSTRU&#199;&#195;O</text>
      <text x="66" y="237" fill="#F5FAFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="850" text-anchor="start">Conectar interface, l&#243;gica e dados.</text>
      <text x="66" y="253" fill="#B2CCE2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8" font-weight="650" text-anchor="start">Fluxo claro e responsabilidade definida.</text><rect x="18" y="274" width="324" height="68" rx="8" fill="url(#panel)" stroke="#238CFF" stroke-opacity="0.55"/>
      <circle cx="44" cy="298" r="11" fill="#238CFF" fill-opacity="0.12" stroke="#238CFF"/>
      <text x="44" y="301" fill="#238CFF" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="7" font-weight="900" text-anchor="middle">03</text>
      <text x="66" y="296" fill="#238CFF" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="7" font-weight="850" text-anchor="start">EVID&#202;NCIA</text>
      <text x="66" y="315" fill="#F5FAFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="850" text-anchor="start">Testar, documentar e publicar.</text>
      <text x="66" y="331" fill="#B2CCE2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8" font-weight="650" text-anchor="start">Qualidade que pode ser conferida.</text>
  <rect x="18" y="360" width="324" height="58" rx="8" fill="url(#panel)" stroke="#28689E"/>
  <text x="32" y="380" fill="#46D39A" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="6.5" font-weight="850" text-anchor="start">PRODUTOS</text>
  <text x="32" y="397" fill="#F5FAFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="7.5" font-weight="700" text-anchor="start">Pain&#233;is e CRMs</text>
  <text x="133" y="380" fill="#55D6FF" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="6.5" font-weight="850" text-anchor="start">INTEGRA&#199;&#213;ES</text>
  <text x="133" y="397" fill="#F5FAFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="7.5" font-weight="700" text-anchor="start">APIs e dados</text>
  <text x="247" y="380" fill="#238CFF" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="6.5" font-weight="850" text-anchor="start">ENTREGA</text>
  <text x="247" y="397" fill="#F5FAFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="7.5" font-weight="700" text-anchor="start">Testes e CI</text>
  </svg>
