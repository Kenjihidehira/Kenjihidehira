<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="titulo">
<title id="titulo">Wesley Kenji Hidehira · Desenvolvedor web · Sistemas web, APIs e automações para operações · Douradina, PR</title>
<style>
  .sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
  .mono{font-family:'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.75}100%{transform:scale(2.5);opacity:0}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){.pulse,.blink,.spin,.flow,.trace,.cycle,.glow,.grow{animation:none!important}}

  .spin{transform-box:view-box;transform-origin:1010px 220px;animation:spin 70s linear infinite}
  .orbit{animation-duration:18s}
  @keyframes spin{to{transform:rotate(360deg)}}
  .cycle{opacity:0;animation:cycle 16s infinite}
  .c1{animation-delay:4s}.c2{animation-delay:8s}.c3{animation-delay:12s}
  @keyframes cycle{0%{opacity:0;transform:translateY(10px)}4%,21%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-10px)}}
  @media (prefers-reduced-motion: reduce){.c0{opacity:1}}
</style>

