<path d="M31 35h26v17H41l-6 5v-5h-4z" fill="none" stroke="#c8ff3e" stroke-width="2.4" stroke-linejoin="round"/><path d="M37 42h14M37 46h9" stroke="#c8ff3e" stroke-width="2.4" stroke-linecap="round"/>
<text class="sans" x="84" y="54" font-size="27" font-weight="700" fill="#ffffff">Contato</text>
