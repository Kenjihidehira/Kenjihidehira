<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="260" viewBox="0 0 1280 260" role="img" aria-labelledby="titulo">
<title id="titulo">Contato: tem um processo que precisa de sistema? Clique para abrir uma proposta no GitHub.</title>
<style>
  .sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
  .mono{font-family:'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.75}100%{transform:scale(2.5);opacity:0}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){.pulse,.blink,.spin,.flow,.trace,.cycle,.glow,.grow{animation:none!important}}

  .pulse-btn{transform-box:fill-box;transform-origin:center;animation:btn 2.6s ease-out infinite}
  @keyframes btn{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.18,1.5);opacity:0}}
  @media (prefers-reduced-motion: reduce){.pulse-btn{animation:none;opacity:0}}
</style>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16239a"/><stop offset="1" stop-color="#2d4af0"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0" gradientTransform="rotate(0 .5 .5)">
    <stop offset="0" stop-color="#c8ff3e"/><stop offset=".35" stop-color="#c8ff3e" stop-opacity="0"/><stop offset=".65" stop-color="#7d93ff" stop-opacity="0"/><stop offset="1" stop-color="#7d93ff"/>
    <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <clipPath id="clip"><rect width="1280" height="260" rx="28"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1280" height="260" fill="url(#bg)"/>
  <circle cx="1220" cy="260" r="60" fill="none" stroke="#ffffff" stroke-opacity="0.08"/><circle cx="1220" cy="260" r="92" fill="none" stroke="#ffffff" stroke-opacity="0.08"/><circle cx="1220" cy="260" r="124" fill="none" stroke="#ffffff" stroke-opacity="0.08"/><circle cx="1220" cy="260" r="156" fill="none" stroke="#ffffff" stroke-opacity="0.08"/><circle cx="1220" cy="260" r="188" fill="none" stroke="#ffffff" stroke-opacity="0.08"/><circle cx="1220" cy="260" r="220" fill="none" stroke="#ffffff" stroke-opacity="0.08"/><circle cx="1220" cy="260" r="252" fill="none" stroke="#ffffff" stroke-opacity="0.08"/><circle cx="1220" cy="260" r="284" fill="none" stroke="#ffffff" stroke-opacity="0.08"/><circle cx="1220" cy="260" r="316" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</g>
<rect x="1.5" y="1.5" width="1277" height="257" rx="27" fill="none" stroke="url(#edge)" stroke-width="3"/>
<text class="mono" x="64" y="80" font-size="14" font-weight="700" letter-spacing="3" fill="#c8ff3e">CONTATO</text>
<text class="sans" x="64" y="146" font-size="40" font-weight="800" letter-spacing="-1" fill="#ffffff">Tem um processo que precisa de sistema?</text>
<text class="sans" font-size="21" fill="#dbe2ff"><tspan x="64" y="196">Clique para abrir uma proposta no GitHub e conte como o processo funciona hoje.</tspan></text>
<rect class="pulse-btn" x="960" y="98" width="256" height="60" rx="30" fill="#c8ff3e" fill-opacity=".35"/>
<rect x="960" y="98" width="256" height="60" rx="30" fill="#c8ff3e"/>
<text class="sans" x="1088" y="136" font-size="21" font-weight="800" fill="#0a1033" text-anchor="middle">Abrir proposta ↗</text>

</svg>
