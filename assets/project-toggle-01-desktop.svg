<svg width="900" height="84" viewBox="0 0 900 84" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>text{letter-spacing:0}</style>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070C15"/>
      <stop offset="0.55" stop-color="#09111D"/>
      <stop offset="1" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111B2B"/>
      <stop offset="1" stop-color="#0A111D"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFC857" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#111B2A" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFC857" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#FFC857"/>
      <stop offset="0.78" stop-color="#42D8FF"/>
      <stop offset="1" stop-color="#42D8FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="accent-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) rotate(34) scale(620 360)">
      <stop stop-color="#FFC857" stop-opacity="0.18"/>
      <stop offset="0.58" stop-color="#FFC857" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFC857" stop-opacity="0"/>
    </radialGradient>
    <pattern id="micro-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#152238" stroke-width="0.7"/>
      <circle cx="1" cy="1" r="0.8" fill="#687994" fill-opacity="0.32"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="898" height="82" rx="11" fill="url(#background)" stroke="#263651" stroke-width="2"/>
  <rect x="2" y="2" width="896" height="80" rx="10" fill="url(#micro-grid)" opacity="0.42"/>
  <rect x="1" y="1" width="6" height="82" rx="3" fill="#FFC857"/>
  <rect x="22" y="1" width="850" height="2.5" rx="1.25" fill="url(#accent-line)"/>
  <circle cx="34" cy="42" r="17" fill="#FFC857" fill-opacity="0.12" stroke="#FFC857" stroke-opacity="0.58"/>
  <text x="34" y="46" fill="#FFC857" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="9" font-weight="950" text-anchor="middle">01</text>
  <text x="66" y="36" fill="#F4F7FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="950" text-anchor="start">PATRIM&#212;NIO OPS</text>
  <text x="66" y="58" fill="#A7B4C9" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="8.5" font-weight="850" text-anchor="start">CONTROLE / CUST&#211;DIA / AUDITORIA</text>
  <rect x="682" y="29" width="112" height="26" rx="13" fill="url(#chip)" stroke="#FFC857" stroke-opacity="0.52"/>
  <circle cx="696" cy="42" r="3.2" fill="#39E6B0" filter="url(#glow)"/>
  <text x="707" y="46" fill="#F4F7FF" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="7.6" font-weight="900" text-anchor="start">PRINCIPAL</text>
  <text x="826" y="39" fill="#687994" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="7" font-weight="850" text-anchor="start">ABRIR</text>
  <text x="826" y="53" fill="#F4F7FF" font-family="Consolas, Cascadia Mono, Segoe UI, monospace" font-size="8.5" font-weight="900" text-anchor="start">FICHA</text>
  <path d="M872 35L879 42L872 49" stroke="#FFC857" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
